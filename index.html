<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow Leopard Packing Game - Genially Ready</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; /* Dark background for letterboxing */
            font-family: sans-serif;
            overflow: hidden; 
            /* Flexbox to keep the game perfectly centered in Genially */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        #game-container {
            position: relative;
            background-image: url('background.jpeg');
            /* 100% 100% prevents cropping. The @media rules prevent stretching. */
            background-size: 100% 100%; 
            background-position: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* --- THE GENIALLY @MEDIA FIX --- */
        /* If the window is wider than 16:9, lock the height to 100% and scale width */
        @media (min-aspect-ratio: 16/9) {
            #game-container {
                height: 100vh;
                width: 177.78vh; /* 100 * (16/9) */
            }
        }

        /* If the window is taller than 16:9, lock the width to 100% and scale height */
        @media (max-aspect-ratio: 16/9) {
            #game-container {
                width: 100vw;
                height: 56.25vw; /* 100 * (9/16) */
            }
        }

        /* --- UI ELEMENTS --- */
        #game-title {
            position: absolute;
            top: 4%;
            width: 100%;
            text-align: center;
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(24px, 4vw, 42px); /* Scales with the screen */
            color: #fff;
            text-shadow: 2px 4px 8px rgba(0,0,0,0.6);
            z-index: 100;
            pointer-events: none;
        }

        #counter {
            position: absolute;
            top: 4%;
            right: 4%;
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(28px, 5vw, 48px);
            color: #f1c40f;
            text-shadow: 2px 4px 8px rgba(0,0,0,0.6);
            z-index: 100;
            pointer-events: none;
        }

        #end-screen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(44, 62, 80, 0.95);
            border: 4px solid #f1c40f;
            border-radius: 24px;
            padding: 5% 8%;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8);
            z-index: 2000;
            align-items: center;
            gap: 40px;
            width: max-content;
        }

        #end-screen img {
            width: clamp(150px, 20vw, 250px);
            height: auto;
        }

        #end-screen .message {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(40px, 8vw, 80px);
            color: #fff;
            text-shadow: 0 4px 15px rgba(241, 196, 15, 0.5);
        }

        /* --- GAME SPRITES --- */
        .item {
            position: absolute;
            height: auto; 
            z-index: 6; 
            transition: left 0.5s ease, top 0.5s ease, transform 0.5s ease; 
        }

        .glow {
            filter: drop-shadow(0 0 15px yellow) drop-shadow(0 0 25px yellow);
        }

        #leopard {
            position: absolute;
            /* Leopard size uses % so it shrinks perfectly in smaller iframes */
            width: 25%; 
            height: auto; 
            cursor: grab;
            z-index: 10;
            user-select: none;
            -webkit-user-drag: none;
        }

        #leopard:active {
            cursor: grabbing;
        }

        /* Stronger Glitter Effect */
        .glitter-particle {
            position: absolute;
            pointer-events: none;
            z-index: 3; 
            color: #fff;
            opacity: 0;
        }

        @keyframes glitter-twinkle {
            0% { opacity: 0; transform: scale(0) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.5) rotate(90deg); filter: drop-shadow(0 0 8px #f1c40f); }
            100% { opacity: 0; transform: scale(0) rotate(180deg); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- UI -->
        <div id="game-title">Jack has/doesn't have to take...</div>
        <div id="counter">0 / 7</div>
        
        <div id="end-screen">
            <img src="leopard2.gif" alt="Snow Leopard" draggable="false">
            <div class="message">Good job!</div>
        </div>
        
        <!-- The Backpack (z-index 5) -->
        <img src="backpack.png" id="backpack" style="position: absolute; left: 84.9%; top: 66.4%; width: 12%; z-index: 5;" draggable="false">

        <!-- Items 1-4 (Width converted to % for stable scaling) -->
        <img src="1.png" id="item1" class="item" style="left: 6.4%; top: 54.0%; width: 4.5%;" draggable="false" data-type="pack" data-dest-left="84.2%" data-dest-top="61.2%" data-dest-rot="279deg">
        <img src="2.png" id="item2" class="item" style="left: 18.6%; top: 86.1%; width: 6%;" draggable="false" data-type="pack" data-dest-left="85.0%" data-dest-top="61.8%" data-dest-rot="4deg">
        <img src="3.png" id="item3" class="item" style="left: 27.9%; top: 54.2%; width: 3.3%;" draggable="false" data-type="pack" data-dest-left="84.1%" data-dest-top="73.6%" data-dest-rot="0deg">
        <img src="4.png" id="item4" class="item" style="left: 68.0%; top: 39.7%; width: 8.7%;" draggable="false" data-type="pack" data-dest-left="87.7%" data-dest-top="59.1%" data-dest-rot="45deg">
        
        <!-- Items 5-7 (Width converted to %) -->
        <img src="5.png" id="item5" class="item" style="left: 1.4%; top: 31.4%; width: 6.2%;" draggable="false" data-type="reject">
        <img src="6.png" id="item6" class="item" style="left: 50.9%; top: 58.8%; width: 6.4%;" draggable="false" data-type="reject">
        <img src="7.png" id="item7" class="item" style="left: 59.4%; top: 83.0%; width: 4.7%;" draggable="false" data-type="reject">

        <!-- The Snow Leopard Cub -->
        <img src="leopard1.gif" id="leopard" style="left: 45%; top: 50%;" draggable="false">
    </div>

    <script>
        const leopard = document.getElementById('leopard');
        const container = document.getElementById('game-container');
        const backpack = document.getElementById('backpack');
        const items = document.querySelectorAll('.item');
        const counterDisplay = document.getElementById('counter');
        const endScreen = document.getElementById('end-screen');
        
        let isDragging = false;
        let shiftX, shiftY;
        let actionTimeout;
        let itemsTried = 0; 
        const totalItems = 7;
        
        // Custom Trigger Radius
        const triggerRadius = 12; 

        // Audio Context setup
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
        }

        // --- AUDIO ENGINE ---
        
        function playVictorySound() {
            if (!audioCtx) return;
            const playNote = (freq, startTime, duration) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'sine';
                osc.frequency.value = freq;
                
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.2, startTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                
                osc.start(startTime);
                osc.stop(startTime + duration);
            };
            
            const now = audioCtx.currentTime;
            playNote(523.25, now, 0.2);        
            playNote(659.25, now + 0.1, 0.2);  
            playNote(783.99, now + 0.2, 0.2);  
            playNote(1046.50, now + 0.3, 0.4); 
        }

        function playWrongSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sawtooth'; 
            
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.4);
            
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.4);
        }

        // --- VISUAL EFFECTS ---

        function playGlitterEffect(item) {
            const rect = item.getBoundingClientRect();
            
            for (let i = 0; i < 80; i++) {
                const glitter = document.createElement('div');
                glitter.className = 'glitter-particle';
                glitter.innerHTML = Math.random() > 0.5 ? '✦' : '✨';
                
                const randomX = (rect.left - 15) + (Math.random() * (rect.width + 30));
                const randomY = (rect.top - 15) + (Math.random() * (rect.height + 30));
                
                glitter.style.left = randomX + 'px';
                glitter.style.top = randomY + 'px';
                glitter.style.fontSize = (Math.random() * 25 + 15) + 'px';
                
                const animDuration = Math.random() * 1.5 + 1.5; 
                const animDelay = Math.random() * 0.5;
                
                glitter.style.animation = `glitter-twinkle ${animDuration}s ease-in-out ${animDelay}s forwards`;
                
                document.body.appendChild(glitter);
                
                setTimeout(() => glitter.remove(), (animDuration + animDelay) * 1000);
            }
        }


        // --- MATH ENGINE & DRAG LOGIC ---
        
        leopard.addEventListener('mousedown', function(event) {
            isDragging = true;
            initAudio(); 
            
            clearTimeout(actionTimeout);
            
            items.forEach(item => {
                if(item.getAttribute('data-done') !== 'true') {
                    item.removeAttribute('data-processing');
                    item.classList.remove('glow');
                }
            });

            leopard.src = 'leopard2.gif';
            
            const rect = leopard.getBoundingClientRect();
            shiftX = event.clientX - rect.left;
            shiftY = event.clientY - rect.top;

            leopard.style.zIndex = 1000;
        });

        document.addEventListener('mousemove', function(event) {
            if (!isDragging) return;

            // Updated math engine to account for centered letterboxing
            const containerRect = container.getBoundingClientRect();

            let newLeft = event.clientX - containerRect.left - shiftX;
            let newTop = event.clientY - containerRect.top - shiftY;

            const maxLeft = container.offsetWidth - leopard.getBoundingClientRect().width;
            const maxTop = container.offsetHeight - leopard.getBoundingClientRect().height;

            if (newLeft < 0) newLeft = 0;
            if (newTop < 0) newTop = 0;
            if (newLeft > maxLeft) newLeft = maxLeft;
            if (newTop > maxTop) newTop = maxTop;

            leopard.style.left = newLeft + 'px';
            leopard.style.top = newTop + 'px';

            const leopardRect = leopard.getBoundingClientRect();
            
            const triggerX = leopardRect.left + (leopardRect.width * 0.16);
            const triggerY = leopardRect.top + (leopardRect.height * 0.67);

            items.forEach(item => {
                if (item.style.display === 'none' || item.getAttribute('data-done') === 'true') return;

                const itemRect = item.getBoundingClientRect();

                const isColliding = (
                    triggerX >= (itemRect.left - triggerRadius) &&
                    triggerX <= (itemRect.right + triggerRadius) &&
                    triggerY >= (itemRect.top - triggerRadius) &&
                    triggerY <= (itemRect.bottom + triggerRadius)
                );

                if (isColliding || item.getAttribute('data-processing') === 'true') {
                    item.classList.add('glow');
                } else {
                    item.classList.remove('glow');
                }
            });
        });

        document.addEventListener('mouseup', function() {
            if (!isDragging) return;
            isDragging = false;
            leopard.style.zIndex = 10;
            
            let hitItem = false;

            items.forEach(item => {
                if (item.classList.contains('glow') && item.style.display !== 'none' && item.getAttribute('data-processing') !== 'true' && item.getAttribute('data-done') !== 'true') {
                    hitItem = true;
                    item.setAttribute('data-processing', 'true');
                    handleInteraction(item);
                }
            });

            if (!hitItem) {
                leopard.src = 'leopard1.gif';
            }
        });

        // --- GAMEPLAY LOGIC ---
        
        function handleInteraction(item) {
            const type = item.getAttribute('data-type');
            leopard.src = 'leopard3.gif';
            
            actionTimeout = setTimeout(() => {
                
                item.classList.remove('glow');
                item.removeAttribute('data-processing');
                item.setAttribute('data-done', 'true');

                if (type === 'pack') {
                    item.style.transition = 'none';

                    item.style.left = item.getAttribute('data-dest-left');
                    item.style.top = item.getAttribute('data-dest-top');
                    item.style.transform = `rotate(${item.getAttribute('data-dest-rot')})`;
                    item.style.zIndex = "2"; 

                    playVictorySound();

                    setTimeout(() => {
                        playGlitterEffect(item);
                    }, 50);

                } else if (type === 'reject') {
                    playWrongSound();

                    const currentRect = item.getBoundingClientRect();
                    const containerRect = container.getBoundingClientRect();
                    
                    // Convert exact pixels back to % based on container size for the slide effect
                    let currentLeftPx = currentRect.left - containerRect.left;
                    let currentTopPx = currentRect.top - containerRect.top;
                    
                    let newLeftPx = currentLeftPx;
                    let newTopPx = currentTopPx; 

                    if (item.id === 'item5') {
                        newLeftPx = currentLeftPx + (container.offsetWidth * 0.1); // Move right by 10%
                        if (newLeftPx > container.offsetWidth - currentRect.width) {
                            newLeftPx = container.offsetWidth - currentRect.width; 
                        }
                    } else if (item.id === 'item6' || item.id === 'item7') {
                        newLeftPx = currentLeftPx - (container.offsetWidth * 0.1); // Move left by 10%
                        if (newLeftPx < 0) {
                            newLeftPx = 0; 
                        }
                    }

                    item.style.left = (newLeftPx / container.offsetWidth * 100) + '%';
                    item.style.top = (newTopPx / container.offsetHeight * 100) + '%';
                }

                itemsTried++;
                counterDisplay.innerText = `${itemsTried} / ${totalItems}`;

                // Check for Game Completion
                if (itemsTried === totalItems) {
                    setTimeout(() => {
                        endScreen.style.display = 'flex';
                        leopard.style.display = 'none'; 
                    }, 1000); 
                }

                if (itemsTried < totalItems) {
                    leopard.src = 'leopard1.gif';
                }

            }, 4000); 
        }
    </script>
</body>
</html>
